<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      padding-bottom: 100px;
    }

    header {
      background: linear-gradient(135deg, #7b2cff, #ff2d75);
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
    }

    .search {
      padding: 20px;
    }

    .search input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      outline: none;
      font-size: 16px;
      background: #1c1c24;
      color: white;
    }

    .section {
      padding: 10px 20px;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .song {
      background: #181820;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cover {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff2d75, #7b2cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .song-info {
      flex: 1;
    }

    .song-info h3 {
      font-size: 17px;
      margin-bottom: 5px;
    }

    .song-info p {
      color: #aaa;
      font-size: 13px;
    }

    button {
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      background: #ff2d75;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #17171e;
      padding: 15px 20px;
      border-top: 1px solid #333;
      text-align: center;
    }

    .player-title {
      margin-bottom: 8px;
      font-weight: bold;
    }

    audio {
      width: 100%;
      max-width: 600px;
    }

    .download {
      display: inline-block;
      margin-top: 8px;
      background: #7b2cff;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎵 MY MUSIC</h1>
    <p>Listen to your favourite music</p>
  </header>

  <div class="search">
    <input
      type="text"
      id="searchBox"
      placeholder="🔍 Search songs..."
      onkeyup="searchSongs()">
  </div>

  <div class="section">
    <h2>🔥 Trending Songs</h2>

    <div class="song">
      <div class="cover">🎵</div>

      <div class="song-info">
        <h3>Mass Beat</h3>
        <p>My Music • 2026</p>
      </div>

      <button onclick="playSong('Mass Beat','songs/song1.mp3')">
        ▶
      </button>
    </div>

    <div class="song">
      <div class="cover">🎧</div>

      <div class="song-info">
        <h3>Love Melody</h3>
        <p>My Music • 2026</p>
      </div>

      <button onclick="playSong('Love Melody','songs/song2.mp3')">
        ▶
      </button>
    </div>

    <div class="song">
      <div class="cover">🔥</div>

      <div class="song-info">
        <h3>Hero BGM</h3>
        <p>My Music • 2026</p>
      </div>

      <button onclick="playSong('Hero BGM','songs/song3.mp3')">
        ▶
      </button>
    </div>

  </div>

  <div class="player">
    <div class="player-title" id="nowPlaying">
      Select a song 🎵
    </div>

    <audio id="audioPlayer" controls></audio>

    <br>

    <a id="downloadBtn"
       class="download"
       href="#"
       download>
       ⬇️ Download
    </a>
  </div>

  <script>

    function playSong(title, file) {

      const player = document.getElementById("audioPlayer");
      const titleBox = document.getElementById("nowPlaying");
      const download = document.getElementById("downloadBtn");

      player.src = file;
      player.play();

      titleBox.innerText = "🎵 " + title;

      download.href = file;
      download.download = title + ".mp3";
    }


    function searchSongs() {

      let input =
        document.getElementById("searchBox")
        .value.toLowerCase();

      let songs =
        document.querySelectorAll(".song");

      songs.forEach(function(song) {

        let name =
          song.innerText.toLowerCase();

        if (name.includes(input)) {
          song.style.display = "flex";
        } else {
          song.style.display = "none";
        }

      });

    }

  </script>

</body>
  </html>
